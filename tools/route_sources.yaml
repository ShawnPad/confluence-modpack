# Non-recipe sources for tools/check_route.py (v1.0 spec §6.1, A18). Format: tools/route_sources.py's docstring (one JSON
# object per entry line; no PyYAML). Every entry is cited: a research section, a decision, a jar path. Tokens: the plan's
# "Route group" table (item id, fluid:<id>, dim:<id>, node:<id>, bee:<id>, comb:<bee>, egg:<bee>).
# Mystical Agriculture crops and Productive Bees bees and combs are generated (tools/route_generated.py), never listed here.
base:
  # Overworld materials available from the start (vanilla worldgen and mob drops, the tier-0 base metals). Each addition is
  # reviewed (spec §6.1).

dimensions:
  # How each dimension opens: from an open dimension, with any one `enter` list held. tier: the tree's tier overview
  # (progression/combined-tree.md "Tier overview"; the ATM Mining Dimension, tier 2½, is 2).
  - {"id": "minecraft:overworld", "tier": 0, "from": null, "enter": [[]], "cite": "progression/combined-tree.md Tier overview, tier 0"}

biome_dimensions:
  # Biome ids and biome tags (as Productive Bees and Mystical Agriculture write them) -> the dimension they are in.

sources:

machines:
  # recipe type -> the items needed to run it. Ids read from the jars when each row is written (spec §10 item 8).

ignored_types:

accepted:
  # Bypasses the owner accepted (decision ids). code: SKIPPABLE, EARLY or QUEST_ORDER. route: recipe ids and source keys.

soft_refs:
  # Bracketed gate refs that are not consumed (a machine that is used, not eaten), kept out of the SKIPPABLE and EARLY checks.
