    allthemodium:vibranium_ingot_from_dust_smelting, allthemodium:vibranium_ingot_from_dust_blasting]
  allthemodium:unobtainium_ingot: [allthemodium:unobtainium_ingot, allthemodium:unobtainium_ingot_from_block,
    allthemodium:unobtainium_ingot_from_ore_blasting, allthemodium:unobtainium_ingot_from_raw_blasting,
