    confluence:bypass/allthemodium_crystal_from_ore, confluence:bypass/allthemodium_crystal_from_raw_ore,
    confluence:bypass/allthemodium_crystal_from_raw_block]
  allthemodium:vibranium_crystal: [allthemodium:processing/vibranium/crystal/from_slurry,
    confluence:bypass/vibranium_crystal_from_ore, confluence:bypass/vibranium_crystal_from_raw_ore,
    confluence:bypass/vibranium_crystal_from_raw_block]
