chapter: twilight
title: Twilight Forest
group: 0C0F1A0000000001
order: 3
icon: twilightforest:knightmetal_ingot
quests:
  - node: D2.1
    title: Twilight Key
    task: item:kubejs:twilight_key
    deps: [X1.1, D1.2, T1.2, M1.2, D1.3]
    coins: 15
    bag: uncommon_bag
    desc: "The key is crafted from a netherite ingot, an Aether zanite gemstone, a Mekanism advanced control circuit, an Ars Nouveau elemental essence and Cataclysm's Monstrous Horn. Throw it into the portal pool instead of a diamond; the diamond no longer opens anything."
  - node: D2.2
    title: Allthemodium Ore
    task: item:allthemodium:raw_allthemodium
    deps: [D2.1, X1.1]
    coins: 10
    desc: "Allthemodium spawns only in the Twilight Forest in this pack, in cave-exposed veins. You need a netherite-tier pickaxe to break it."
  - node: D2.3
    title: Allthemodium Template
    task: item:allthemodium:allthemodium_upgrade_smithing_template
    deps: [D2.2, X1.1]
    coins: 10
    desc: "The template is added to the Twilight stronghold cache loot, so it stays inside the dimension with the ore. Smithing table: netherite gear plus Allthemodium ingots plus this template."
  - node: D2.4
    title: Knightmetal
    task: item:twilightforest:knightmetal_ingot
    deps: [D2.1]
    coins: 10
    desc: "Goblin Knights in the Dark Forest's Knight Stronghold drop armor shards; nine shards craft into a cluster that smelts into a Knightmetal Ingot. Twilight Forest, unchanged."
  - node: D2.5
    title: Teleport Pad
    task: item:allthemodium:teleport_pad
    deps: [D2.2]
    coins: 10
    desc: "Allthemodium's own recipe, unchanged: four Allthemodium nuggets and an ender pearl. It opens the Mining Dimension, the only place Powah uraninite spawns in this pack."
  - node: T2.2
    title: Dissolution Chamber
    task: item:industrialforegoing:dissolution_chamber
    deps: [T0.4, T1.2]
    coins: 10
    desc: "Rewritten: Industrial Foregoing's chamber keeps its Pity Machine Frame and plastic, and one gold ingot becomes a Mekanism basic control circuit."
  - node: T2.1
    title: Simple Machine Frame
    task: item:industrialforegoing:machine_frame_simple
    deps: [T0.4, T2.2, M1.2]
    coins: 10
    desc: "Rewritten: made in the Dissolution Chamber from a Pity Machine Frame, plastic and latex, with an Ars Nouveau elemental essence in place of one of the two nether bricks."
  - node: M2.1
    title: Arcane Anvil
    task: item:irons_spellbooks:arcane_anvil
    deps: [T2.1]
    coins: 10
    desc: "Rewritten: Iron's Spells' anvil now takes an Industrial Foregoing Simple Machine Frame in place of one polished deepslate. Everything else is Iron's default."
  - node: M2.2
    title: Source Gem Block
    task: item:ars_nouveau:source_gem_block
    deps: [M0.1]
    desc: "Ars Nouveau, unchanged: an amethyst block imbued with 2,000 Source in the Imbuement Chamber. It feeds the tier-3 ritual brazier and the End focus later."
  - node: S2.1
    title: Storage Terminal
    task: item:toms_storage:storage_terminal
    deps: [T2.1, M1.2, S1.1, S0.2]
    coins: 10
    desc: "Rewritten: Tom's terminal now needs an Industrial Foregoing Simple Machine Frame, an Ars Nouveau elemental essence, a Functional Storage drawer controller plus its netherite upgrade, and a Sophisticated Storage chest."
  - node: X2.1
    title: Spirited Crystal
    task: item:powah:crystal_spirited
    deps: [T0.3, D2.5]
    coins: 10
    desc: "Rewritten: the Energizing Orb now makes Powah's spirited crystal from uraninite instead of an emerald, and uraninite only spawns in the Mining Dimension behind the Teleport Pad."
  - node: X2.2
    title: Ore Quintupling
    task: checkmark
    deps: [T0.2]
    desc: "Audit: Mekanism's 5x slurry chain works on base metals with no restriction, but each tier ore's chain consumes the next tier's material, so it multiplies a tier you already reached and never opens one early."
  - node: X2.3
    title: No Tier-Ore Seeds
    task: checkmark
    desc: "Audit: Mystical Agriculture ships no seed for Allthemodium, Vibranium, Unobtainium or any planet metal, and none is added here. Its default crops stay as content."
  - node: X2.4
    title: No Tier-Ore Bees
    task: checkmark
    desc: "Audit: Productive Bees ships no bee for Allthemodium, Vibranium, Unobtainium or any planet metal, and none is added here. The mod stays as content."
  - node: X2.5
    title: No Laser-Drilled Debris
    task: checkmark
    deps: [T2.1]
    desc: "Audit: Industrial Foregoing's Laser Drill keeps its base-ore tables, but the ancient debris entry is removed and no tier-ore or planet-metal entry is added. Netherite stays a trip to the Nether."
  - node: X2.6
    title: No Uncrafting
    task: checkmark
    desc: "Audit: the Twilight Forest Uncrafting Table is removed. It could reverse the keys and cross-mod recipes this pack is built on."
