chapter: twilight
title: Twilight Forest
group: 0C0F1A0000000001
order: 3
icon: twilightforest:knightmetal_ingot
quests:
  - node: D2.1
    title: Twilight Key
    task: item:kubejs:twilight_key
    deps: [X1.1, D1.2, T1.2, M1.2, D1.3]
    coins: 15
    bag: uncommon_bag
    desc: "Craft the key from a netherite ingot, an Aether zanite gemstone, a Mekanism advanced control circuit, an Ars Nouveau elemental essence and Cataclysm's Monstrous Horn. Throw it into the portal pool instead of a diamond - the diamond no longer opens anything. Through it lie Allthemodium and knightmetal."
  - node: D2.2
    title: Allthemodium Ore
    task: item:allthemodium:raw_allthemodium
    deps: [D2.1, X1.1]
    coins: 10
    desc: "Allthemodium spawns only in the Twilight Forest here, in the floors of caves below y 10, so look down rather than up. Bring a netherite-tier pickaxe or it will not break. The raw ore is what the smithing template and the Teleport Pad wait on."
  - node: D2.3
    title: Allthemodium Template
    task: item:allthemodium:allthemodium_upgrade_smithing_template
    deps: [D2.2, X1.1]
    coins: 10
    desc: "The template is in the Twilight stronghold cache loot, so it stays inside the dimension with the ore - go raid one. Then take it to a smithing table with netherite gear and Allthemodium ingots to upgrade your kit."
  - node: D2.4
    title: Knightmetal
    task: item:twilightforest:knightmetal_ingot
    deps: [D2.1]
    coins: 10
    desc: "Fight the Goblin Knights in the Dark Forest's Knight Stronghold for armor shards, craft them into a cluster, then smelt the cluster into a Knightmetal Ingot. Twilight Forest's own recipes are untouched, so this is a straight loot-and-smelt run."
  - node: D2.5
    title: Teleport Pad
    task: item:allthemodium:teleport_pad
    deps: [D2.2]
    coins: 10
    desc: "Craft the pad from four Allthemodium nuggets and an ender pearl; the recipe is unchanged. It opens the Mining Dimension, the only place Powah uraninite spawns in this pack, and uraninite is what the Spirited Crystal needs."
  - node: T2.2
    title: Dissolution Chamber
    task: item:industrialforegoing:dissolution_chamber
    deps: [T0.4, T1.2]
    coins: 10
    desc: "Industrial Foregoing's chamber still wants its Pity Machine Frame and plastic, but one gold ingot is now a Mekanism basic control circuit instead. Build it, because the Simple Machine Frame is made inside it."
  - node: T2.1
    title: Simple Machine Frame
    task: item:industrialforegoing:machine_frame_simple
    deps: [T0.4, T2.2, M1.2]
    coins: 10
    desc: "This one is made in the Dissolution Chamber from a Pity Machine Frame, plastic and latex, with an Ars Nouveau elemental essence standing in for one of the two nether bricks. It is the part the Arcane Anvil and the storage terminal both call for, so plan on building more than one."
  - node: M2.1
    title: Arcane Anvil
    task: item:irons_spellbooks:arcane_anvil
    deps: [T2.1]
    coins: 10
    desc: "Iron's Spells' anvil now takes an Industrial Foregoing Simple Machine Frame in place of one polished deepslate; everything else is Iron's default. Build it once you have a spare frame - it is the magic side's payoff for the tech chain you just finished."
  - node: M2.2
    title: Source Gem Block
    task: item:ars_nouveau:source_gem_block
    deps: [M0.1]
    desc: "Imbue an amethyst block with 2,000 Source in Ars Nouveau's Imbuement Chamber; the recipe is unchanged. Stock up on these - the ritual brazier and the End focus both call for them later."
  - node: S2.1
    title: Storage Terminal
    task: item:toms_storage:storage_terminal
    deps: [T2.1, M1.2, S1.1, S0.2]
    coins: 10
    desc: "Tom's terminal now pulls one part from every branch: an Industrial Foregoing Simple Machine Frame, an Ars Nouveau elemental essence, a Functional Storage drawer controller plus its netherite upgrade, and a Sophisticated Storage chest. Gather all five before you start the craft - this is the top of the storage ladder for now."
  - node: X2.1
    title: Spirited Crystal
    task: item:powah:crystal_spirited
    deps: [T0.3, D2.5]
    coins: 10
    desc: "Powah's spirited crystal is now energized from uraninite instead of an emerald. Bring uraninite back from the Mining Dimension behind the Teleport Pad and feed it to the Energizing Orb."
  - node: X2.2
    title: Ore Quintupling
    task: checkmark
    deps: [T0.2, D3.2]
    desc: "Good to know: Mekanism's 5x slurry chain runs on base metals with no restriction at all. Tier ores are different - each one's chain consumes the next tier's material, so it multiplies a tier you have already reached and can never open one early."
  - node: X2.3
    title: No Tier-Ore Seeds
    task: checkmark
    desc: "Good to know: Mystical Agriculture ships no seed for Allthemodium, Vibranium, Unobtainium or any planet metal, and none has been added. Its default crops are still here to enjoy, just not as a shortcut past a gate."
  - node: X2.4
    title: No Tier-Ore Bees
    task: checkmark
    desc: "Good to know: Productive Bees ships no bee for Allthemodium, Vibranium, Unobtainium or any planet metal, and none has been added. Keep the mod for its own sake, not as a way around a dimension."
  - node: X2.5
    title: No Laser-Drilled Debris
    task: checkmark
    deps: [T2.1]
    desc: "Good to know: Industrial Foregoing's Laser Drill keeps its base-ore tables, but the ancient debris entry is removed and no tier ore or planet metal is added. Netherite stays a trip to the Nether."
  - node: X2.6
    title: No Uncrafting
    task: checkmark
    desc: "Good to know: the Twilight Forest Uncrafting Table is removed, because it could reverse the keys and cross-mod recipes this pack is built on. Plan your crafts - there is no taking them apart again."
