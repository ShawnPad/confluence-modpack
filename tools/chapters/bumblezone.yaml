    desc: "Find the Throne Pillar and its Bee Queen - a honey compass locked onto the pillar points the way. Trade with her: she pays in treasures and, at the end of her line of requests, in Essence of the Bees."
  - node: BZ.2
    title: Essence of the Bees
    task: item:the_bumblezone:essence_of_the_bees
    deps: [BZ.1]
